[package]
name = "ozai-iroh-peer"
version = "0.0.0"
edition = "2024"
publish = false
description = "Minimal iroh 1.3.0 QUIC peer, the interop partner for the ozai Zig endpoint"
license = "MIT"

[[bin]]
name = "ozai-iroh-peer"
path = "src/main.rs"

[dependencies]
# `noq` 1.3.0 is the QUIC core pinned to the exact version `iroh` 1.3.0 depends
# on (`iroh-1.3.0/Cargo.toml:289-292`), driven directly so `src/rpk.rs` can
# require strict raw-public-key negotiation in both roles. `iroh` itself remains
# for `--tls iroh`, the stock endpoint used to prove mutual interop without
# changing its upstream TLS verifier or resolver. `tls-ring` is what makes
# `presets::Minimal` exist (`iroh-1.3.0/src/endpoint/presets.rs:59`), and it puts
# ring in the graph the same way `noq`'s `ring` feature does, so there is one
# provider throughout. Neither dependency is a range: an interop peer pinned to
# nothing is an interop peer that drifts.
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
noq = { version = "=1.3.0", default-features = false, features = [
    "runtime-tokio",
    "ring",
    "rustls",
] }
# One rustls in the graph: noq-proto asks for `0.23.33` and this asks for
# `0.23`, so cargo unifies them and the `QuicServerConfig` below is the same
# type the core uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Already in the graph through noq's `ring` feature; used for the Ed25519
# operations that run before rustls is configured.
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
anyhow = "1"

[profile.release]
debug = 1